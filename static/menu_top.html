<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<style>
body {
    font-family: Helvetica;
}
select {
    position: absolute;
    top: 40px;
    background: transparent;
    border: 1px solid #ddd;
    font-size: 0.9em;
}
#logo {
    /*position: absolute;*/
    top: 0;
    margin: 0;
    padding: 0;
}
</style>
<script>
var mementoweb_links = {
        "title": "Memento Project",
        "logo": "/static/css/images/memento_logo.svg",
        "menu_items": {
            "https://mementoweb.org/about/": "About",
            "https://mementoweb.org/demo/": "Demos",
            "https://mementoweb.org/depot/": "Depot",
            "https://mementoweb.org/guide/": "Guide",
            "https://mementoweb.org/tools/": "Tools"
        }
}
var timetravel_links = {
        "title": "Time Travel",
        "logo": "/static/css/images/timetravel_logo.png",
        "menu_items": {
            "https://timetravel.mementoweb.org/about/": "About",
            "https://timetravel.mementoweb.org/api/": "API",
            "https://timetravel.mementoweb.org/privacy-policy/": "Privacy",
            "https://timetravel.mementoweb.org/terms-of-service/": "Terms"
        }
}
var apps = {
    "https://mementoweb.org/": mementoweb_links,
    "https://robustlinks.mementoweb.org/": {
        "title": "Robust Links",
        "logo": "/static/css/images/robustlinks.png",
        "menu_items": {
            "https://robustlinks.mementoweb.org/about/": "About",
            "https://robustlinks.mementoweb.org/demo/": "Demos",
            "https://robustlinks.mementoweb.org/spec/": "Spec",
            "https://robustlinks.mementoweb.org/tools/": "Tools"
        }
    },
    "https://timetravel.mementoweb.org/": timetravel_links,
    "https://whatdiditlooklike.mementoweb.org/": {
        "title": "What Did It Look Like",
        "logo": "/static/css/images/whatdiditlooklike.png",
        "menu_items": {
            "https://whatdiditlooklike.mementoweb.org/about": "About",
            "https://whatdiditlooklike.mementoweb.org/archives": "Archive",
            "https://www.tumblr.com/register/follow/whatdiditlooklike": "Follow"
        }
    }
}
window.addEventListener("message", function(event) {
//window.onload = function() {
    var req = event.data;
    //var req = window.top.location.href;
    //var req = window.location.href;
    var applogo = document.getElementById("app_logo");
    var applogoimg = document.getElementById("app_logo_img");

    var appselect = document.createElement("select");
    appselect.id = "app_select";
    appselect.onchange = function() {
        window.top.location = this.options[this.selectedIndex].value;
    }
    applogo.appendChild(appselect);

    var menu_selected = false;
    for (appUrl in apps) {
        var option = document.createElement("option");
        option.value = appUrl;
        option.text = apps[appUrl]['title'];
        if (req.search(appUrl) == 0 && !menu_selected) {
            menu_selected = true;
            option.selected = "selected";
            applogoimg.src = apps[appUrl]['logo'];
            if (apps[appUrl]['menu_items'] != null) {
                var items = apps[appUrl]['menu_items'];
                var appmenu = document.getElementById("app_menu");
                for (itemUrl in items) {
                    var item = document.createElement("a");
                    item.href = itemUrl;
                    item.target = "_parent";
                    item.textContent = items[itemUrl];
                    appmenu.appendChild(item);
                    appmenu.appendChild(document.createTextNode(" "));
                }
            }
        }
        appselect.appendChild(option);
    }
//}
});
</script>

</head>
<body style="">
<div style="">
    <div style="border-bottom: 1px solid #ddd; height: 1px; position: absolute; width: 50%; padding-top: 38px; z-index: -10;margin-left: 280px;"></div>
    <span id="app_logo">
                <a href="https://timetravel.mementoweb.org/" target="_parent">
                    <img id="app_logo_img" src="/static/css/images/timetravel_logo.png" style="width: 80px; height: 80px;"/>
                </a>
                <!--
                <select id="app_select" onchange="window.top.location = this.options[this.selectedIndex].value;">
                    <option value="https://mementoweb.org/about/">Memento Project</option>
                    <option value="https://robustlinks.mementoweb.org/">Robust Links</option>
                    <option value="https://timetravel.mementoweb.org/">Time Travel</option>
                    <option value="https://whatdiditlooklike.mementoweb.org/">What Did It Look Like</option>
                </select>
                -->
    </span>
    <span id="app_menu" style="float: right; padding-top: 30px; padding-left: 10px; background: #fff;">
    </span>
</div>
</body>
</html>
